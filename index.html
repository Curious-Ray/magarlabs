<style>
  /* Magarlabs tokens — magar-labs/tailwind.config.js.
     DARK IS THE DEFAULT; light is opt-in via [data-theme="light"]. */
  :root {
    color-scheme: dark;
    --base: #12110E; --panel: #1B1A16; --panel-2: #24221D;
    --line: #2F2C26; --line-strong: #423E36;
    --ink: #F2F0EB; --ink-2: #B3AEA3; --ink-3: #8A867B;
    --accent: #3B82F6; --accent-deep: #2563EB; --accent-soft: rgba(59,130,246,.16);
    --flag-ring: rgba(255,255,255,.22);
    --overlay: rgba(0,0,0,.6);
    --sel: rgba(59,130,246,.32);
    --dot: rgba(255,255,255,.075); --dot-hi: 59,130,246;
    --sh-card: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.32);
    --sh-popup: 0 4px 8px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.55);
    --sh-accent: 0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(37,99,235,.35);

    --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-xl: 16px;
    --f-display: "Space Grotesk", system-ui, sans-serif;
    --f-body: "Inter", "Noto Sans Devanagari", "Noto Sans Arabic", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --base: #FAF9F6; --panel: #FFFFFF; --panel-2: #F2F0EB;
    --line: #E8E5DF; --line-strong: #D5D1C8;
    --ink: #1B1A16; --ink-2: #5B584F; --ink-3: #8C887D;
    --accent: #2563EB; --accent-deep: #1D4ED8; --accent-soft: #EBF1FE;
    --flag-ring: rgba(27,26,22,.14);
    --overlay: rgba(27,26,22,.4);
    --sel: rgba(37,99,235,.18);
    --dot: rgba(27,26,22,.10); --dot-hi: 37,99,235;
    --sh-card: 0 1px 2px rgba(27,26,22,.04), 0 8px 24px rgba(27,26,22,.05);
    --sh-popup: 0 4px 8px rgba(27,26,22,.06), 0 24px 64px rgba(27,26,22,.12);
    --sh-accent: 0 1px 2px rgba(29,78,216,.25), 0 4px 12px rgba(37,99,235,.25);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--base); color: var(--ink);
    font-family: var(--f-body); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--sel); }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  h1, h2 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }

  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; width: 100%; max-width: 620px; margin-inline: auto; padding: 28px 20px 44px; }

  .label {
    margin: 0 0 10px;
    font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  /* Arabic/Devanagari: tracked-out mono breaks joins and has no glyphs */
  .script-complex .label {
    font-family: var(--f-body); letter-spacing: normal; text-transform: none; font-size: 12px;
  }

  /* ---------- header ---------- */
  .head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .welcome { margin: 0 0 22px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
  .head .me { width: 38px; height: 38px; border-radius: 999px; object-fit: cover; flex-shrink: 0; }
  .head h1 { font-size: 16px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .head .handle { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .head .who { min-width: 0; }
  .head .right { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  /* four buttons + a nowrap name overflow a narrow phone — Support goes icon-only */
  @media (max-width: 420px) {
    #supportBtn { padding-inline: 8px; }
    #supportBtn span { display: none; }
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding-inline: 10px; border-radius: var(--r-sm);
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
    border: 1px solid var(--line); background: var(--panel);
    transition: border-color .18s ease, background-color .18s ease, transform .12s ease;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn--accent {
    background: var(--accent); border-color: var(--accent-deep);
    color: #fff; box-shadow: var(--sh-accent);
  }
  .btn--accent:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn--icon { padding-inline: 8px; }
  .store-btn {
    position: relative;
    overflow: hidden;
    height: 32px;
    padding-inline: 12px 11px;
    gap: 6px;
    border-color: #185ABC;
    background: #1A73E8;
    color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.26);
  }
  .store-btn:hover {
    border-color: #1A73E8;
    background: #2B7DE9;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    transform: translateY(-1px);
  }
  .store-btn:active { transform: translateY(1px); }
  .store-btn .store-arrow {
    width: 13px;
    height: 13px;
    margin-inline-start: -1px;
    transition: transform .18s ease, opacity .18s ease;
    opacity: .82;
  }
  .store-btn:hover .store-arrow {
    transform: translate(1px, -1px);
    opacity: 1;
  }
  .store-btn--edge {
    border-color: #087C75;
    background: #0F9D8A;
    box-shadow: 0 1px 2px rgba(0,0,0,.26);
  }
  .store-btn--edge:hover {
    border-color: #0F9D8A;
    background: #18A999;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
  }
  .store-btn--firefox {
    border-color: #C65F0C;
    background: #F97316;
    box-shadow: 0 1px 2px rgba(0,0,0,.26);
  }
  .store-btn--firefox:hover {
    border-color: #F97316;
    background: #FB8124;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
  }
  /* sun shows in dark (click → light), moon shows in light (click → dark) */
  #themeBtn .ico-moon { display: none; }
  [data-theme="light"] #themeBtn .ico-sun { display: none; }
  [data-theme="light"] #themeBtn .ico-moon { display: block; }

  /* ---------- language ---------- */
  .lang { position: relative; }
  .flag {
    display: inline-block; flex-shrink: 0; width: 17px; height: 12px;
    border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--flag-ring);
  }
  .flag svg { display: block; width: 100%; height: 100%; }
  .lang .chev { width: 11px; height: 11px; color: var(--ink-3); transition: transform .18s ease; }
  .lang.open .chev { transform: rotate(180deg); }
  .lang-menu {
    position: absolute; inset-inline-end: 0; top: calc(100% + 6px);
    width: 178px; padding: 5px; display: none; z-index: 20;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--sh-popup);
  }
  .lang.open .lang-menu { display: block; animation: pop .16s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .lang-menu button {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: var(--r-sm); font-size: 12.5px; text-align: start;
  }
  .lang-menu button:hover { background: var(--panel-2); }
  /* --accent, not --accent-deep: the deep blue is unreadable on the dark panel */
  .lang-menu button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ---------- listing ---------- */
  .list {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-xl); box-shadow: var(--sh-card); overflow: hidden;
  }
  .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--panel-2); }
  .row .hit { position: absolute; inset: 0; z-index: 1; }
  .row > *:not(.hit) { position: relative; z-index: 2; }
  .row .icon {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--r-md);
    overflow: hidden; border: 1px solid var(--line); background: var(--panel-2);
  }
  .row .icon img { width: 100%; height: 100%; object-fit: cover; }
  .row .icon--plain {
    border: 0;
    background: transparent;
    border-radius: 0;
    overflow: visible;
  }
  .row .icon--plain img { object-fit: contain; }
  .row .txt { flex: 1; min-width: 0; }
  .row .name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--f-display);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }
  .row .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .row .free-tag {
    flex-shrink: 0;
    color: #7DDC9A;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
  }
  :root[data-theme="light"] .row .free-tag {
    color: #16803D;
  }
  .row .desc {
    display: block;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.4;
  }
  .row .browsers { display: flex; gap: 4px; flex-shrink: 0; }
  .row .browsers img { width: 15px; height: 15px; }
  @media (max-width: 460px) { .row .browsers { display: none; } }
  .row .btn { flex-shrink: 0; }
  /* "Add to Firefox" is too wide for a narrow phone row — fall back to "Install" */
  .lbl-short { display: none; }
  @media (max-width: 540px) {
    .lbl-full { display: none; }
    .lbl-short { display: inline; }
  }

  /* ---------- faq ---------- */
  .block { margin-top: 30px; }
  .faq-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; }
  .faq-item + .faq-item { border-top: 1px solid var(--line); }
  .faq-item > button {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 12px 15px; text-align: start;
    font-size: 13.5px; font-weight: 600; line-height: 1.4;
  }
  .faq-item > button:hover { background: var(--panel-2); }
  .script-complex .faq-item > button { line-height: 1.55; }
  .plus { margin-inline-start: auto; flex-shrink: 0; width: 18px; height: 18px; position: relative; color: var(--ink-3); }
  .plus::before, .plus::after {
    content: ""; position: absolute; inset-inline: 2px; top: 50%;
    height: 1.5px; background: currentColor; border-radius: 2px; transition: transform .22s ease;
  }
  .plus::after { transform: rotate(90deg); }
  .faq-item.open .plus { color: var(--accent); }
  .faq-item.open .plus::after { transform: rotate(0deg); }
  .faq-panel { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .28s ease, opacity .2s ease; }
  .faq-item.open .faq-panel { max-height: 400px; opacity: 1; }
  .faq-panel p { margin: 0; padding: 0 15px 14px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
  .faq-panel code {
    font-family: var(--f-mono); font-size: .92em;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r-xs); padding: .08em .35em;
    direction: ltr; unicode-bidi: isolate; /* keep chrome://… intact in RTL */
  }

  /* ---------- contact ---------- */
  .contact {
    padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-xl); box-shadow: var(--sh-card);
  }
  .contact h2 { font-size: 14.5px; font-weight: 600; }
  .contact p { margin: 3px 0 13px; font-size: 13px; color: var(--ink-2); }
  .contact .links { display: flex; flex-wrap: wrap; gap: 7px; }

  /* ---------- footer ---------- */
  footer { margin-top: 26px; }
  footer p { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }
  footer .rights { font-family: var(--f-mono); margin-top: 5px; }

  /* ---------- modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: var(--overlay); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .modal.open { display: flex; animation: pop .2s ease; }
  .modal-card {
    width: 100%; max-width: 380px; padding: 22px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-xl); box-shadow: var(--sh-popup);
  }
  .modal-card h2 { font-size: 17px; font-weight: 700; }
  .modal-card > p { margin: 6px 0 14px; font-size: 13px; color: var(--ink-2); }
  .rel-list { display: grid; gap: 6px; margin-bottom: 16px; }
  .rel-list a {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--panel-2); font-size: 13px; font-weight: 600;
  }
  .rel-list a:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rel-list .swatch { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .rel-list svg { width: 13px; height: 13px; color: var(--ink-3); margin-inline-start: auto; flex-shrink: 0; }
  [dir="rtl"] .rel-list svg { transform: scaleX(-1); }
  .modal-foot { display: flex; justify-content: flex-end; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

         "<code>chrome://settings/downloads</code> में \"हर फ़ाइल को सेव करने से पहले पूछें\" बंद करें। चालू रहने पर Chrome एक्सटेंशन के बताए फ़ाइल नाम और फ़ोल्डर को अनदेखा करता है।"],
        ["क्या ये मोबाइल पर चलते हैं?",
         "नहीं — सिर्फ़ डेस्कटॉप पर। Android और iOS के Chrome और Edge एक्सटेंशन नहीं चलाते।"],
        ["क्या मेरा डेटा कहीं भेजा जाता है?",
         "ऑटोमेशन आपके ब्राउज़र में चलता है। कुछ टूल साइन-इन या होस्टेड कम्पैटिबिलिटी चेक इस्तेमाल कर सकते हैं, लेकिन टेलीमेट्री नहीं है।"]
      ]
    },
    ar: {
      support: "الدعم", changelog: "سجل التغييرات", close: "إغلاق", email: "البريد",
      languageLabel: "اللغة", themeLabel: "المظهر",
      extensionsTitle: "الامتدادات", faqTitle: "الأسئلة الشائعة",
      install: "تثبيت", view: "عرض", free: "مجاني",
      addTo: "أضف إلى {browser}", welcome: "شكرًا لتثبيتك الامتداد. إليك بقية الأدوات المجانية التي صنعتها.",
      contactTitle: "شيء لا يعمل؟",
      contactBlurb: "أخبرني وسأصلحه. كل ما هنا مجاني.",
      changelogBody: "ملاحظات الإصدار وصفحات المنتج:",
      supportSubject: "طلب دعم",
      footerNote: "امتدادات مستقلة. لا ترتبط بـ Magnific أو Higgsfield أو Google.",
      desc: {
        magnific: "موجّهات صور وفيديو دفعة واحدة على Magnific.",
        higgsfield: "موجّهات صور وفيديو دفعة واحدة على Higgsfield.",
        googleFlow: "موجّهات صور وفيديو دفعة واحدة في Google Flow."
      },
      faq: [
        ["يتوقّف عندما أنتقل بين التبويبات أو أصغّر النافذة.",
         "يقيّد Chrome المؤقّتات في التبويبات الخلفية. أبقِ التبويب ظاهرًا — انقله إلى نافذة أو شاشة ثانية بدلًا من تصغيره."],
        ["التنزيلات غير مرقّمة أو غير موزّعة على مجلّدات.",
         "أوقف \"السؤال عن مكان حفظ كل ملف\" من <code>chrome://settings/downloads</code>. فبينما يكون مفعّلًا، يتجاهل Chrome اسم الملف والمجلّد اللذين يطلبهما الامتداد."],
        ["هل تعمل على الهاتف؟",
         "لا — على الحاسوب فقط. لا يشغّل Chrome و Edge الامتدادات على Android و iOS."],
        ["هل تُرسَل بياناتي؟",
         "تعمل الأتمتة داخل متصفّحك. قد تستخدم بعض الأدوات تسجيل الدخول أو فحوصات توافق مستضافة، لكن لا يوجد تتبّع."]
      ]
    }
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var mailto = function (subject) { return "mailto:" + EMAIL + "?subject=" + encodeURIComponent(subject); };
  var OUT_ICON = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5m0-5L10 14M19 14v5H5V5h5"/></svg>';
  var STORE_ARROW = '<svg class="store-arrow" fill="none" stroke="currentColor" stroke-width="2.15" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5m0-5L9 15"/></svg>';

  var currentLang = "en";

  function renderProducts(t) {
    $("#products").innerHTML = PRODUCTS.map(function (p) {
      var target = storeFor(p);
      var label = target.browser ? t.addTo.replace("{browser}", BROWSER_LABEL[target.browser]) : t.view;
      var storeClass = "btn btn--accent store-btn" + (target.browser ? " store-btn--" + target.browser : "");

      var browsers = BROWSER_ORDER.filter(function (b) { return p.stores[b]; })
        .map(function (b) {
          return '<img src="assets/browser-' + b + '.svg" alt="' + BROWSER_LABEL[b] + '" title="' + BROWSER_LABEL[b] + '" loading="lazy">';
        }).join("");

      return '<div class="row">' +
        /* whole row is a click target, but it's a mouse convenience only:
           kept out of the tab order so the visible button owns focus */
        '<a class="hit" href="' + target.url + '" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true"></a>' +
        '<span class="icon' + (p.plainIcon ? " icon--plain" : "") + '"><img src="' + p.icon + '" alt="" loading="lazy"></span>' +
        '<span class="txt"><span class="name">' + p.name + '</span>' +
        '<span class="meta"><span class="free-tag">' + t.free + '</span>' +
        '<span class="desc">' + t.desc[p.id] + "</span></span></span>" +
        '<span class="browsers">' + browsers + "</span>" +
        '<a class="' + storeClass + '" href="' + target.url + '" target="_blank" rel="noopener noreferrer" aria-label="' +
          p.name + " — " + label + '">' +
          '<span class="lbl-full">' + label + '</span>' +
          '<span class="lbl-short">' + (target.browser ? t.install : t.view) + "</span>" +
          STORE_ARROW +
        "</a></div>";
    }).join("");
  }

  function renderFaq(t) {
    $("#faqList").innerHTML = t.faq.map(function (row, i) {
      var open = FAQ_OPEN.indexOf(i) !== -1;
      return '<div class="faq-item' + (open ? " open" : "") + '">' +
        '<button type="button" aria-expanded="' + open + '"><span>' + row[0] +
        '</span><span class="plus" aria-hidden="true"></span></button>' +
        '<div class="faq-panel"><p>' + row[1] + "</p></div></div>";
    }).join("");
  }

  function renderChangelog() {
    $("#changelogList").innerHTML = PRODUCTS.map(function (p) {
      return '<a href="' + storeFor(p).url + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="swatch" style="background:' + p.accent + '"></span><span>' +
        p.name + "</span>" + OUT_ICON + "</a>";
    }).join("");
  }

  function renderLangMenu() {
    $("#langMenu").innerHTML = LANGS.map(function (l) {
      return '<button type="button" role="option" data-code="' + l.code + '" aria-selected="' +
        (l.code === currentLang) + '"><span class="flag">' + FLAGS[l.code] + "</span><span>" +
        l.name + "</span></button>";
    }).join("");
  }

  function applyLang(code) {
    var meta = LANGS.filter(function (l) { return l.code === code; })[0] || LANGS[0];
    var t = I18N[meta.code];
    currentLang = meta.code;

    document.documentElement.lang = meta.code;
    $("#root").setAttribute("dir", meta.dir);
    $("#root").classList.toggle("script-complex", !!meta.complex);
    $("#langFlag").innerHTML = FLAGS[meta.code];

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      var val = t[el.getAttribute("data-i18n")];
      if (val) el.textContent = val;
    });

    $("#supportBtn").href = mailto(t.supportSubject);
    $("#emailBtn").href = mailto(t.supportSubject);
    /* these collapse to icon-only, so name them explicitly */
    $("#langBtn").setAttribute("aria-label", t.languageLabel + ": " + meta.name);
    $("#changelogBtn").setAttribute("aria-label", t.changelog);
    $("#supportBtn").setAttribute("aria-label", t.support);
    $("#themeBtn").setAttribute("aria-label", t.themeLabel);

    renderProducts(t);
    renderFaq(t);
    renderChangelog();
    renderLangMenu();

    try { localStorage.setItem("ma-lang", meta.code); } catch (e) {}
  }

  function detectLang() {
    var saved;
    try { saved = localStorage.getItem("ma-lang"); } catch (e) {}
    if (saved && I18N[saved]) return saved;
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return I18N[nav] ? nav : "en";
  }

  /* ------------------------------------------------------------------
     BACKGROUND — the Magarlabs dot-grid as a job pipeline.
     The lattice is the track; packets route along it in right angles,
     trailing a comet tail and pinging every node they cross, then retire
     and respawn. Queued work flowing through, finishing, being replaced.
     Nothing floats free: every motion follows the grid.
     ------------------------------------------------------------------ */
  var BG = (function () {
    var canvas = $("#bg");
    if (!canvas || !canvas.getContext) return { sync: function () {} };
    var ctx = canvas.getContext("2d");

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine = window.matchMedia("(pointer: fine)").matches;

    var GAP = 30;     // lattice spacing, px
    var DOT_R = 1;    // resting node radius
    var REACH = 150;  // pointer bloom radius
    var TRAIL = 26;   // samples kept per packet — ~2 cells of streak, enough to read as travel
    var FLASH = 26;   // node ping lifetime, frames
    var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    var w = 0, h = 0, dpr = 1, cols = 0, rows = 0;
    var tx = -9999, ty = -9999, px = -9999, py = -9999;
    var dot = "rgba(0,0,0,.1)", hi = [37, 99, 235];
    var packets = [], flashes = [];

    /* The reading column is off limits — traffic belongs in the side margins.
       Measured from <main> rather than hardcoded, so it tracks the layout. */
    var colL = 0, colR = 0, sideRoom = 0;
    var FEATHER = 80;   // px over which traffic fades out as it nears the column
    var MIN_ROOM = 70;  // narrower margins than this aren't worth animating

    function measureColumn() {
      var m = document.querySelector("main");
      if (!m) { colL = 0; colR = w; sideRoom = 0; return; }
      var r = m.getBoundingClientRect();
      colL = r.left; colR = r.right;
      sideRoom = Math.min(colL, w - colR);
    }

    /* 1 out in the margins, 0 over the column, soft ramp between */
    function clearance(x) {
      var d = x < colL ? colL - x : (x > colR ? x - colR : 0);
      if (d <= 0) return 0;
      return d >= FEATHER ? 1 : d / FEATHER;
    }

    function makePacket() {
      var d = DIRS[(Math.random() * 4) | 0];
      // spawn in a margin so packets start where they'll actually be seen
      var leftCols = Math.floor((colL - 6) / GAP);
      var rightCol0 = Math.ceil((colR + 6) / GAP);
      var ni;
      if (Math.random() < 0.5 && leftCols > 0) ni = (Math.random() * leftCols) | 0;
      else ni = rightCol0 + ((Math.random() * Math.max(1, cols - rightCol0)) | 0);

      return {
        ni: ni,
        nj: (Math.random() * rows) | 0,
        di: d[0], dj: d[1],
        t: Math.random(),
        spd: 1.8 + Math.random() * 1.4,          // px per frame
        life: 0,
        ttl: 300 + ((Math.random() * 420) | 0),  // frames before the job retires
        trail: []
      };
    }

    function seed() {
      packets = [];
      flashes = [];
      // no usable margin (phones, narrow windows) — lattice only, and no sim to run
      if (sideRoom < MIN_ROOM) return;
      // scale the fleet to the margin area, not the whole viewport
      var n = Math.max(4, Math.min(16, Math.round((sideRoom * 2 * h) / 46000)));
      for (var i = 0; i < n; i++) {
        var p = makePacket();
        p.life = (Math.random() * 200) | 0;      // stagger so they don't fade in unison
        packets.push(p);
      }
    }

    function step(p) {
      p.life++;
      p.t += p.spd / GAP;

      while (p.t >= 1) {
        p.ni += p.di; p.nj += p.dj; p.t -= 1;
        if (flashes.length < 60) flashes.push({ x: p.ni * GAP, y: p.nj * GAP, age: 0 });
        if (Math.random() < 0.3) {               // turn 90deg, never reverse
          var turnLeft = Math.random() < 0.5;
          var ndi = turnLeft ? p.dj : -p.dj;
          var ndj = turnLeft ? -p.di : p.di;
          p.di = ndi; p.dj = ndj;
        }
      }

      var off = p.ni < -1 || p.nj < -1 || p.ni > cols + 1 || p.nj > rows + 1;
      if (off || p.life > p.ttl) {
        var fresh = makePacket();
        for (var k in fresh) p[k] = fresh[k];
        return;
      }

      p.trail.unshift({ x: (p.ni + p.di * p.t) * GAP, y: (p.nj + p.dj * p.t) * GAP });
      if (p.trail.length > TRAIL) p.trail.pop();
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);

      // the track: one batched path for the whole lattice
      ctx.fillStyle = dot;
      ctx.beginPath();
      for (var i = 0; i <= cols; i++) {
        var x = i * GAP;
        for (var j = 0; j <= rows; j++) {
          var y = j * GAP;
          ctx.moveTo(x + DOT_R, y);
          ctx.arc(x, y, DOT_R, 0, 6.2832);
        }
      }
      ctx.fill();

      if (reduce) return;

      var rgb = hi[0] + "," + hi[1] + "," + hi[2];

      // node pings, expanding and fading where a packet just landed
      for (var f = flashes.length - 1; f >= 0; f--) {
        var fl = flashes[f];
        fl.age++;
        if (fl.age > FLASH) { flashes.splice(f, 1); continue; }
        var cf = clearance(fl.x);
        if (cf <= 0) continue;
        var k = fl.age / FLASH;
        ctx.beginPath();
        ctx.arc(fl.x, fl.y, DOT_R + k * 5.5, 0, 6.2832);
        ctx.strokeStyle = "rgba(" + rgb + "," + ((1 - k) * 0.3 * cf).toFixed(3) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // packets: comet tail + bright head
      ctx.lineCap = "round";
      for (var q = 0; q < packets.length; q++) {
        var p = packets[q];
        var a = Math.min(p.life / 40, (p.ttl - p.life) / 40, 1);
        if (a <= 0 || !p.trail.length) continue;
        for (var s2 = 0; s2 < p.trail.length - 1; s2++) {
          // per-segment, so a trail dissolves as it slides toward the column
          var cs = clearance(p.trail[s2].x);
          if (cs <= 0) continue;
          var fade = 1 - s2 / TRAIL;
          ctx.beginPath();
          ctx.moveTo(p.trail[s2].x, p.trail[s2].y);
          ctx.lineTo(p.trail[s2 + 1].x, p.trail[s2 + 1].y);
          ctx.strokeStyle = "rgba(" + rgb + "," + (a * fade * 0.42 * cs).toFixed(3) + ")";
          ctx.lineWidth = fade * 1.5 + 0.3;
          ctx.stroke();
        }
        var ch = clearance(p.trail[0].x);
        if (ch > 0) {
          ctx.beginPath();
          ctx.arc(p.trail[0].x, p.trail[0].y, 1.8, 0, 6.2832);
          ctx.fillStyle = "rgba(" + rgb + "," + (a * 0.85 * ch).toFixed(3) + ")";
          ctx.fill();
        }
      }

      // pointer bloom, dialled down so the packets stay the story
      if (!fine || px < -1000) return;
      var i0 = Math.floor((px - REACH) / GAP), i1 = Math.ceil((px + REACH) / GAP);
      var j0 = Math.floor((py - REACH) / GAP), j1 = Math.ceil((py + REACH) / GAP);
      for (var a2 = i0; a2 <= i1; a2++) {
        var ax = a2 * GAP;
        for (var b = j0; b <= j1; b++) {
          var by = b * GAP;
          var dx = ax - px, dy = by - py;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > REACH) continue;
          var cb = clearance(ax);
          if (cb <= 0) continue;
          var lit = 1 - dist / REACH;
          lit *= lit;
          ctx.beginPath();
          ctx.arc(ax, by, DOT_R + lit * 1.5, 0, 6.2832);
          ctx.fillStyle = "rgba(" + rgb + "," + (lit * 0.45 * cb).toFixed(3) + ")";
          ctx.fill();
        }
      }
    }

    function frame() {
      for (var i = 0; i < packets.length; i++) step(packets[i]);
      px += (tx - px) * 0.1;
      py += (ty - py) * 0.1;
      draw();
      requestAnimationFrame(frame);
    }

    function sync() {
      var cs = getComputedStyle(document.documentElement);
      var d = cs.getPropertyValue("--dot").trim();
      var a = cs.getPropertyValue("--dot-hi").trim();
      if (d) dot = d;
      if (a) hi = a.split(",").map(Number);
      if (reduce) draw();
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / GAP);
      rows = Math.ceil(h / GAP);
      measureColumn();   // must precede seed() — spawning is margin-relative
      seed();
      if (reduce) draw();
    }

    sync();
    resize();
    window.addEventListener("resize", resize);

    if (fine && !reduce) {
      window.addEventListener("pointermove", function (e) {
        if (px < -1000) { px = e.clientX; py = e.clientY; }
        tx = e.clientX; ty = e.clientY;
      }, { passive: true });
      document.addEventListener("pointerleave", function () { tx = -9999; ty = -9999; });
    }
    if (!reduce) requestAnimationFrame(frame);

    return { sync: sync };
  })();

  /* ---------- theme (dark is the default; only "light" is ever stored) ---------- */
  var THEME_COLOR = { dark: "#12110E", light: "#FAF9F6" };
  function applyTheme(mode) {
    var light = mode === "light";
    if (light) document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    $("#themeBtn").setAttribute("aria-pressed", String(light));
    $("#themeColor").setAttribute("content", light ? THEME_COLOR.light : THEME_COLOR.dark);
    BG.sync(); // dot colours come from the theme tokens
    try { localStorage.setItem("ma-theme", light ? "light" : "dark"); } catch (e) {}
  }
  $("#themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });
  /* the <head> bootstrap already set the attribute — just sync button + meta */
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");

  var langWrap = $("#lang");
  function closeLang() {
    langWrap.classList.remove("open");
    $("#langBtn").setAttribute("aria-expanded", "false");
  }
  $("#langBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    var open = langWrap.classList.toggle("open");
    $("#langBtn").setAttribute("aria-expanded", String(open));
  });
  $("#langMenu").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-code]");
    if (!btn) return;
    applyLang(btn.getAttribute("data-code"));
    closeLang();
  });

  $("#faqList").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var open = btn.parentElement.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });

  var modal = $("#changelogModal");
  function closeModal() { modal.classList.remove("open"); }
  $("#changelogBtn").addEventListener("click", function () { modal.classList.add("open"); });
  $("#changelogClose").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

  document.addEventListener("click", closeLang);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeLang(); }
  });

  applyLang(detectLang());
})();
</script>
</body>
</html>
